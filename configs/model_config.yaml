model:
  vocab_size: 50257
  d_model: 256
  n_heads: 8
  n_layers: 6
  ffn_dim: 1024
  block_size: 512
  dropout: 0.1

training:
  epochs: 10
  batch_size: 16
  learning_rate: 3.0e-4
  weight_decay: 0.1
  warmup_steps: 100
  grad_clip: 1.0
  eval_interval: 500
  save_interval: 1000

data:
  train_split: 0.9
  seed: 42

paths:
  data_raw: data/raw
  data_processed: data/processed
  data_tokenized: data/tokenized
  checkpoints: models/checkpoints
  logs: logs
  outputs: outputs
